# Playbook push backend — Cloudflare Worker config.
# See backend/README.md for the full deploy walkthrough.

name = "playbook-push"
main = "worker.js"
compatibility_date = "2024-11-01"

# Per-device alert state (subscription + alerts + seen map). Create with:
#   wrangler kv namespace create PB
# then paste the printed id below.
[[kv_namespaces]]
binding = "PB"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# The heartbeat: run every minute. The Worker itself skips any device whose
# markets are all closed, so off-hours runs do almost nothing.
[triggers]
crons = ["* * * * *"]

# VAPID_PUBLIC, VAPID_PRIVATE and VAPID_SUBJECT are provided as secrets:
#   wrangler secret put VAPID_PUBLIC
#   wrangler secret put VAPID_PRIVATE
#   wrangler secret put VAPID_SUBJECT      # e.g. mailto:you@example.com
