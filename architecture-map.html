<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playbook — Architecture Map</title>
<style>
  :root {
    --bg:        #0F0F0F;
    --panel:     #161616;
    --panel-2:   #1c1c1c;
    --border:    #2a2a2a;
    --text:      #e8e8e8;
    --muted:     #8a8a8a;
    --client:    #4ea1ff;
    --route:     #7bd389;
    --service:   #c792ea;
    --db:        #ffb86b;
    --external:  #ff6b9d;
    --critical:  #ff3860;
    --accent:    #f5b942;
    --accent-2:  #ff7a45;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #topbar {
    position: fixed; top: 0; left: 0; right: 340px; z-index: 20;
    display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
    padding: 10px 14px;
    background: linear-gradient(to bottom, rgba(15,15,15,.97), rgba(15,15,15,.88));
    border-bottom: 1px solid var(--border);
  }
  #topbar h1 { font-size: 15px; font-weight: 700; margin-right: 10px; white-space: nowrap; }
  #topbar h1 span { color: var(--muted); font-weight: 400; }
  .chip {
    padding: 4px 12px; border-radius: 999px; cursor: pointer; user-select: none;
    font-size: 12px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border);
    transition: all .15s;
  }
  .chip:hover { color: var(--text); border-color: #3a3a3a; }
  .chip.active { color: #111; background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .chip.crit.active { background: var(--critical); border-color: var(--critical); color: #fff; }
  #zoomctl {
    position: fixed; left: 14px; bottom: 14px; z-index: 20; display: flex; gap: 6px;
  }
  #zoomctl button {
    width: 34px; height: 30px; border-radius: 8px; cursor: pointer;
    background: var(--panel); color: var(--text); border: 1px solid var(--border); font-size: 14px;
  }
  #zoomctl button.fit { width: auto; padding: 0 10px; font-size: 12px; }
  #zoomctl button:hover { background: var(--panel-2); }
  #legend {
    position: fixed; left: 14px; bottom: 56px; z-index: 20;
    background: rgba(22,22,22,.92); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 12px; font-size: 11px; color: var(--muted);
  }
  #legend .row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  #legend .swatch { width: 18px; height: 0; border-top: 2.5px solid; border-radius: 2px; }
  #canvas { position: fixed; inset: 0; right: 340px; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  svg { display: block; width: 100%; height: 100%; }
  .cluster-box { rx: 14; }
  .cluster-label { font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .node rect { rx: 9; transition: opacity .15s; cursor: pointer; }
  .node text { pointer-events: none; }
  .node .lbl { font-size: 13px; font-weight: 650; fill: var(--text); }
  .node .sub { font-size: 10.5px; fill: var(--muted); }
  .node.dim { opacity: .13; }
  .edge path { fill: none; transition: opacity .15s; }
  .edge.dim { opacity: .07; }
  .edge text {
    font-size: 10px; fill: #b9b9b9;
    paint-order: stroke; stroke: var(--bg); stroke-width: 3.5px; stroke-linejoin: round;
  }
  #sidebar {
    position: fixed; top: 0; right: 0; bottom: 0; width: 340px; z-index: 30;
    background: var(--panel); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 16px 16px 40px;
  }
  #sidebar h2 { font-size: 15px; margin-bottom: 2px; }
  #sidebar .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  #sidebar h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 16px 0 6px;
  }
  #sidebar .rolebox {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; font-size: 12.5px; margin-bottom: 8px;
  }
  #sidebar .plainbox { border-left: 3px solid var(--accent); background: var(--panel-2);
    border-radius: 0 8px 8px 0; padding: 9px 11px; font-size: 12.5px; color: #d6d0c4; }
  #sidebar code, #sidebar .path {
    font: 11.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    background: #101010; border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 6px; color: var(--db); word-break: break-all; display: inline-block;
  }
  #sidebar ul { list-style: none; }
  #sidebar ul li { font-size: 12px; color: #c9c9c9; padding: 4px 0 4px 14px; position: relative; }
  #sidebar ul li::before { content: "▪"; position: absolute; left: 0; color: var(--accent); font-size: 9px; top: 7px; }
  #sidebar .edgeitem { font-size: 11.5px; color: #bdbdbd; padding: 3px 0; }
  #sidebar .edgeitem b { color: var(--text); font-weight: 600; }
  #sidebar .edgeitem .k { font-size: 10px; padding: 1px 6px; border-radius: 99px; margin-right: 5px; }
  #sidebar .finding { border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin: 6px 0; font-size: 12px; }
  #sidebar .finding b { display: block; margin-bottom: 2px; }
  #sidebar .finding.warn { border-left: 3px solid var(--accent-2); }
  #sidebar .finding.good { border-left: 3px solid var(--route); }
  #sidebar .tagchip { display: inline-block; font-size: 10px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 99px; padding: 1px 8px; margin: 2px 3px 0 0; }
  #sidebar .hint { color: var(--muted); font-size: 11.5px; margin-top: 14px; }
</style>
</head>
<body>

<div id="topbar">
  <h1>Playbook <span>· architecture map</span></h1>
  <!-- chips injected by script -->
</div>

<div id="canvas"><svg id="svg"></svg></div>

<div id="legend">
  <div class="row"><span class="swatch" style="border-color:var(--critical)"></span> critical seam (price → alert)</div>
  <div class="row"><span class="swatch" style="border-color:var(--accent-2)"></span> external API call</div>
  <div class="row"><span class="swatch" style="border-color:var(--db)"></span> storage read/write</div>
  <div class="row"><span class="swatch" style="border-color:#5ec8f8"></span> load / mount</div>
  <div class="row"><span class="swatch" style="border-color:#6a6a6a"></span> function call</div>
</div>

<div id="zoomctl">
  <button class="fit" id="btnFit">Fit</button>
  <button id="btnPlus">+</button>
  <button id="btnMinus">−</button>
</div>

<div id="sidebar"></div>

<script>
"use strict";
// ═════════════════════════════════════════════════════════════════════════════
// DATA — hand-editable. Keep this shape: clusters[], N(), nodes[], edges[].
// Coordinates are absolute canvas units; the renderer below is generic.
// ═════════════════════════════════════════════════════════════════════════════

const clusters = [
  { id: 'shell',    label: 'Client shell (device)',                     x: 40,   y: 80,  w: 270, h: 560 },
  { id: 'storage',  label: 'Device storage',                            x: 40,   y: 720, w: 270, h: 310 },
  { id: 'app',      label: 'React app — app.js (12,189 lines)',         x: 380,  y: 80,  w: 330, h: 1310 },
  { id: 'modules',  label: 'Shared modules (no build step)',            x: 790,  y: 80,  w: 310, h: 812 },

const N = (id, cluster, label, sub, x, y, w, h, color, opts = {}) => ({

const nodes = [
  // ── Client shell ─────────────────────────────────────────────────────────

    path:  'sw.js:2',

    tag: ['overview', 'alerts', 'all'],
    critical: true,

  N('manifest', 'shell', 'manifest.json', '+ manifest-light.json', 60, 470, 230, 64, 'client', {

    path:  'manifest.json',
    notes: ['index.html:26 applyIconTheme() swaps the manifest link + apple-touch-icon before React loads',
            'icon choice persisted under localStorage pb.iconTheme.v1'],
    tag: ['overview', 'all'],

  // ── Device storage ───────────────────────────────────────────────────────

    path:  'app.js:37',
    notes: ['app.js:37 LS adapter (get/set with JSON + try/catch)',
            'app.js:65 gatherBackup() enumerates every backup-worthy key for export/restore',
            'per-key layout is a compatibility contract — cloud backup/restore is byte-identical per key',

    path:  'app.js:1869',
    notes: ['app.js:1869 bgIdbOpen / bgIdbGet / bgIdbSet (client side)',
            'sw.js:177 same DB opened from the service worker (BG_DB / kv / alertState)',
            'app reconciles bgTriggered history on next focus so alerts never double-fire'],
    tag: ['alerts', 'all'],
  }),

  // ── React app (app.js) ───────────────────────────────────────────────────
  N('app-root', 'app', 'App()', 'root component · all wiring', 400, 140, 290, 72, 'route', {
    role:  'Root React component: owns tab navigation, modal state, the two-tier price fetch plan, and instantiates every hook (portfolio, price feed, alerts, push, backup).',

            'app.js:2977 useToastEvents wraps ~28 mutators with stable identities so memoized leaves skip re-renders',
            'app.js:9330 publishes window.PBApp — the 43-primitive bridge (Icon, PriceBlock, fmt, timeAgo, …) that pb-views.js and pb-modals.js read at render time; inc-15 moved DetailModal into pb-modals.js, which now also reads PBData and renders its alert popup via ReactDOM.createPortal; inc-16 moved the whole DetailModal sub-component subtree (PriceChart, FundamentalsBlock, WatchlistControl, ...) into the bucket too, shrinking the bridge 29 -> 23; inc-17 moved SettingsModal + its TabReorderList into the bucket (bridge 23 -> 31, mostly shared tab/market data consts + FX-display helpers); inc-18 moved AlertsModal (display + CRUD only — no alert eval, no money math) into the bucket with 0 new bridge members; feature PRs #27-#29 grew the bridge to 33; inc-19 moved ImportModal (~612 lines, display + delegate — the pb-import.js matching helpers + the app.js impure readers stay put) into the bucket, bridge 33 -> 37 (+TickerSearch, parseImportFile, ocrImageFile, searchListingsMulti) plus the first PBImport IIFE reads; inc-20 opened the money tier: BuyModal (the in-body average cost-basis re-blend + the onBuy payload) moved into the bucket with 0 new bridge members (positionCostCcy read from the PBCore global inside the bucket); inc-21 followed with SellModal (the percent/shares sync + the pnl preview) at 0 new bridge / 0 new IIFE reads; inc-22 closed the money tier — and Phase-4 modal extraction — with PositionModal (the cost-basis save payload: cost mode / currency / crypto total-vs-per-unit -> perUnitCost, plus the diffChanges edit diff), bridge 37 -> 38 (+MarketPicker, a multi-caller shared with WatchlistView), DATA read at render time, 0 new IIFE reads; inc-23 moved HeatmapView (plus its HeatmapFullscreen chrome) into pb-views.js (display + delegate; HeatmapTreemap + ZoomPanHeatmap stay in app.js, reached via the bridge; SectorDetailModal read from PBModals at render time), bridge 38 -> 39 (+HeatmapTreemap) plus the convertCcy/positionCostCcy/marketCurrency/priceKey/fetchQuoteBatchLight IIFE reads; inc-24 opened the view tier's core: DashboardView (plus its single-caller PortfolioLineChart growth-chart cluster) moved into pb-views.js, bridge 39 -> 41 (+PortfolioPieChart, a multi-caller shared with TFSAView, +fmtNum) plus five more IIFE reads (CURRENCY_SYMBOLS/MARKET_CURRENCY/contribInDisplay/quoteTradedToday/fetchHistory); the two contribution modals read from PBModals at render time and the portfolio-fill delegation guard now spans app.js + pb-views.js; inc-25 moved CurrentView (the Holdings tab — display + per-market aggregation; buy/sell/edit/import delegated to props) into pb-views.js, bridge 41 -> 43 (+HoldingRow, +HoldingsListHead, multi-callers shared with the staying TFSAView) plus the MARKETS/valuePositionInCostCcy IIFE reads',
            'tab order/hiding is user-configurable (reconcileTabOrder app.js:2816)'],
    tag: ['overview', 'prices', 'portfolio', 'all'],
    critical: true,
  }),
  N('use-price-feed', 'app', 'usePriceFeed()', 'polling engine · 45s / 5min', 400, 232, 290, 64, 'route', {
    role:  'The live-price polling engine: market-hours-aware cadence, progressive batch merge into the store, manual refresh with cache-busting, fail-streak tracking.',
    plain: 'The heartbeat. Every 45 seconds while a market is open (every 5 minutes when all are closed, to save battery) it fetches fresh prices and paints them as they arrive.',
    path:  'app.js:1733',
    notes: ['app.js:1820 OPEN_POLL_MS 45s / CLOSED_POLL_MS 5min, flipped by a 60s meta-timer',
            'app.js:1737 seeds prices from the localStorage cache so the app opens showing real numbers',
            'app.js:1776 a manual tap mid-fetch queues one forced cache-busted re-run — never silently dropped',
            'persists the price map debounced (1.2s) so bursts write once'],
    tag: ['overview', 'prices', 'all'],
    critical: true,
  }),
  N('use-portfolio', 'app', 'usePortfolio()', 'holdings · mutators · preview', 400, 320, 290, 64, 'route', {
    role:  'Exposes all portfolio collections (positions, watchlist, alerts, contributions, TFSA deposits, sector caches) plus every mutator; swaps in the read-only demo book in Preview mode.',
    plain: 'The bookkeeper. Everything you own, watch or have deposited flows through here, including the "Preview" switch that shows a fake demo portfolio so you can demo the app without exposing real money.',
    path:  'app.js:2162',
    notes: ['app.js:2239 startup dedup merges duplicate ticker+market rows via shared mergeCostBasis',
            'app.js:2220 self-heals a stale cached index.html by lazily injecting demo-data.js on demand',
            'app.js:2235 guardPreview: every mutator no-ops with a toast while previewing',
            'collections live in PBStore (per-key localStorage write-through), not React state'],
    tag: ['overview', 'portfolio', 'all'],
  }),
  N('alert-engine', 'app', 'useAlertEngine()', 'foreground trigger loop', 400, 408, 290, 64, 'route', {
    role:  'Subscribes to the price store and re-runs the shared alert evaluator on every price or alert change; fires notifications and appends trigger history.',
    plain: 'The tripwire watcher (while the app is open). Each time a price lands it checks "did any of my price alerts just cross their target?" and pops a notification if so.',
    path:  'app.js:1840',
    notes: ['app.js:1850 delegates to evaluateTriggers (app.js:1404), a thin adapter over PBCore.evaluateAlerts',
            'seen-map read via ref to avoid a feedback loop that could double-fire',
            'app.js:1849 preview mode never fires real alerts from the demo book',
            'trigger history capped and persisted under pb.triggered.v2'],

    critical: true,
  }),
  N('bg-alerts', 'app', 'useBackgroundAlerts()', 'periodic sync mirror', 400, 496, 290, 64, 'route', {

    path:  'app.js:1910',
    notes: ['app.js:1899 registerPeriodicAlertSync — periodicSync tag "check-alerts", minInterval throttled by the OS',
            'app.js:1892 bgWriteConfig writes {alerts, seen} to IDB on every change',

    tag: ['alerts', 'all'],
  }),
  N('push-hook', 'app', 'usePushBackend()', 'server-push registration', 400, 584, 290, 64, 'route', {
    role:  'Registers the browser push subscription with the optional Cloudflare Worker and keeps the server-side alert list in sync on every alert change.',

    path:  'app.js:2082',
    notes: ['app.js:1981 backendPost — plain JSON POSTs to /subscribe and /sync',
            'app.js:1972 getOrCreatePushSub — pushManager.subscribe with the server’s VAPID public key',

    notes: ['app.js:146 encryptBlob — AES-GCM, key via PBKDF2 from the recovery code (app.js:139)',
            'app.js:135 sha256Hex(recoveryCode) is the server-side lookup key; the code itself never leaves the device',

  N('views', 'app', 'Tab views', 'Dashboard · Watchlist · Heatmap · TFSA · …', 400, 760, 290, 84, 'route', {
    role:  'The tab views still living in app.js — DashboardView, CurrentView, WatchlistView, HeatmapView, TFSAView, RulesView, OverviewView — all subscribing to the store per-slice. Picks, Hedges and Hot Topics render from the pb-views.js bucket.',

    path:  'app.js:4871',
    notes: ['DashboardView app.js:4871 · CurrentView 5254 · WatchlistView 6286 · HeatmapView 7698 · TFSAView 8369 · RulesView 8498',

            'heatmap uses a hand-rolled squarified treemap (layoutSquarify app.js:7154) + pinch-zoom',
            'PortfolioLineChart (app.js:3997) and PortfolioPieChart (4489) are hand-drawn SVG — no chart library',

    tag: ['overview', 'portfolio', 'prices', 'all'],
  }),
  N('detail-modal', 'app', 'DetailModal', 'per-stock deep dive', 400, 868, 290, 64, 'route', {
    role:  'Full-screen stock detail: price block, range chart with pre/post shading, fundamentals, news, thesis, alerts and watchlist controls.',
    plain: 'What opens when you tap a stock: a big chart, the key financial numbers, recent news, and your own notes and alerts for it.',
    path:  'app.js:9331',
    notes: ['PriceChart app.js:8579 — SVG chart with extended-hours shading from session-classified bars',
            'FundamentalsBlock app.js:9034 — P/E vs sector forward-P/E context',
            'app.js:9104 NEW analyst-targets card — S&P Global consensus (mean target, upside vs price, rating) from the stockanalysis forecast feed',
            'indicator cards (VIX, CPI, …) swap in IndicatorValueBlock + plain-English IndicatorAbout (app.js:9287)'],
    tag: ['overview', 'prices', 'all'],
  }),
  N('import-ui', 'app', 'ImportModal + TickerSearch', 'CSV · XLSX · PDF · screenshot OCR', 400, 956, 290, 64, 'route', {
    role:  'Holdings-import UI: accepts pasted text, CSV/XLSX/PDF files and broker screenshots (client-side OCR), then matches rows to live listings for confirmation.',
    plain: 'How you get an existing portfolio in without retyping it: paste a list, drop a spreadsheet, or upload screenshots of your broker app — it reads them and figures out which real stocks they are.',
    path:  'pb-modals.js:2481',
    notes: ['inc-19 moved ImportModal (~612 lines) into the pb-modals.js bucket (bridge 33 -> 37); TickerSearch + the impure readers parseImportFile/ocrImageFile/searchListingsMulti stay in app.js and are bridged; the pb-import.js matchers are read from the PBImport global in the bucket',
            'tesseract.js, xlsx and pdf.js are lazy-loaded from CDN only when first needed (loadScriptOnce app.js:5629)',
            'ocrImageFile app.js:5768 — EasyEquities screenshots parsed by PBImport heuristics',
            'TickerSearch app.js:5972 + fetchYahooSearch 5518 — live listing search with market inference',
            'contribution/cash-flow files parsed separately (parseCashFlowFile app.js:5913)'],
    tag: ['import', 'all'],
  }),
  N('fundamentals', 'app', 'fetchFundamentals()', 'parallel sources · per-field merge', 400, 1044, 290, 64, 'route', {

// ── Edge geometry ────────────────────────────────────────────────────────────
// Anchor on the facing sides; multiple edges sharing a node side get spread
// ports so they don't stack. Cubic beziers; 'h' edges bow through the vertical
// gutters between columns, 'v' edges through the horizontal bands.
function edgeMode(a, b) {
  const acx = a.x + a.w / 2, acy = a.y + a.h / 2;
  const bcx = b.x + b.w / 2, bcy = b.y + b.h / 2;
  const dx = bcx - acx, dy = bcy - acy;
  if (Math.abs(dx) > Math.abs(dy) * 0.85) return dx > 0 ? 'R' : 'L';
  return dy > 0 ? 'D' : 'U';
}
// port spreading: count edges per (node, side)
const portCount = {}, portIdx = {};
edges.forEach(e => {
  const a = nodeById[e.from], b = nodeById[e.to];
  const m = edgeMode(a, b);
  const sa = e.from + ':' + (m === 'R' ? 'r' : m === 'L' ? 'l' : m === 'D' ? 'd' : 'u');
  const sb = e.to   + ':' + (m === 'R' ? 'l' : m === 'L' ? 'r' : m === 'D' ? 'u' : 'd');
  portCount[sa] = (portCount[sa] || 0) + 1;
  portCount[sb] = (portCount[sb] || 0) + 1;
  e._sa = sa; e._sb = sb;
});
function portOffset(key) {
  const n = portCount[key], i = (portIdx[key] = (portIdx[key] || 0) + 1) - 1;
  return (i - (n - 1) / 2) * Math.min(16, 44 / Math.max(1, n - 1) || 16);
}
function bez(t, p0, p1, p2, p3) {
  const u = 1 - t;
  return u*u*u*p0 + 3*u*u*t*p1 + 3*u*t*t*p2 + t*t*t*p3;
}
function edgePath(e) {
  const a = nodeById[e.from], b = nodeById[e.to];
  const m = edgeMode(a, b);
  const oa = portOffset(e._sa), ob = portOffset(e._sb);
  let x1, y1, x2, y2, c1x, c1y, c2x, c2y;
  if (m === 'R' || m === 'L') {
    x1 = m === 'R' ? a.x + a.w : a.x;
    x2 = m === 'R' ? b.x : b.x + b.w;
    y1 = a.y + a.h / 2 + oa;
    y2 = b.y + b.h / 2 + ob;
    const k = Math.max(46, Math.abs(x2 - x1) * 0.42) * (m === 'R' ? 1 : -1);
    c1x = x1 + k; c1y = y1; c2x = x2 - k; c2y = y2;
  } else {
    y1 = m === 'D' ? a.y + a.h : a.y;
    y2 = m === 'D' ? b.y : b.y + b.h;
    x1 = a.x + a.w / 2 + oa;
    x2 = b.x + b.w / 2 + ob;
    const k = Math.max(36, Math.abs(y2 - y1) * 0.42) * (m === 'D' ? 1 : -1);
    c1x = x1; c1y = y1 + k; c2x = x2; c2y = y2 - k;
  }
  const t = e.lt != null ? e.lt : 0.5;
  return {
    d: `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`,
    lx: bez(t, x1, c1x, c2x, x2),
    ly: bez(t, y1, c1y, c2y, y2),
  };
}

// edges
const edgeEls = edges.map(e => {

});

let lockedSel = false;

function nodeMatchesChip(n) {
  if (activeChip === 'critical') return !!n.critical;
  if (activeChip === 'overview') return true;
  return (n.tag || []).includes(activeChip);
}
function edgeMatchesChip(e) {
  return (e.tag || []).includes(activeChip);
}
function applyDim() {
  const selN = selectedId ? nodeById[selectedId] : null;
  const connected = new Set();
  if (selN) {
    connected.add(selN.id);
    edges.forEach(e => {
      if (e.from === selN.id) connected.add(e.to);
      if (e.to === selN.id) connected.add(e.from);
    });
  }
  nodes.forEach(n => {
    let dim = !nodeMatchesChip(n);
    if (selN) dim = dim || !connected.has(n.id);
    nodeEls[n.id].classList.toggle('dim', dim);
  });
  edges.forEach((e, i) => {
    let dim = !edgeMatchesChip(e);
    if (selN) dim = dim || (e.from !== selN.id && e.to !== selN.id);
    edgeEls[i].classList.toggle('dim', dim);
  });
}

    ${n.notes && n.notes.length ? `<h3>Notes</h3><ul>${n.notes.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
    ${bugs.length ? `<h3>Known bugs</h3>${bugs.map(b => `<div class="finding warn"><b>${esc(b.sev)}${b.ref ? ' · ' + esc(b.ref) : ''}</b>${esc(b.t)}</div>`).join('')}` : ''}
    ${fixes.length ? `<h3>Planned fixes</h3>${fixes.map(f => `<div class="finding good"><b>#${f.n}</b>${esc(f.t)}</div>`).join('')}` : ''}
    ${inc.length ? `<h3>Incoming (${inc.length})</h3>${inc.map(e => `<div class="edgeitem">${kindPill(e.kind)}<b>${esc(nodeById[e.from].label)}</b> — ${esc(e.label)}</div>`).join('')}` : ''}
    ${out.length ? `<h3>Outgoing (${out.length})</h3>${out.map(e => `<div class="edgeitem">${kindPill(e.kind)}→ <b>${esc(nodeById[e.to].label)}</b> — ${esc(e.label)}</div>`).join('')}` : ''}
    <h3>Feature tags</h3>
    <div>${(n.tag || []).map(t => `<span class="tagchip">${esc(t)}</span>`).join('')}</div>
    <div class="hint">Click the canvas background to go back to the overview.</div>`;
}

function select(id, lock) {
  selectedId = id;
  if (lock) lockedSel = !!id;
  if (id) renderNodeSidebar(nodeById[id]); else renderDefaultSidebar();
  applyDim();
}

// ── Pan / zoom ───────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
let tx = 0, ty = 0, scale = 1;
function applyTransform() {
  world.setAttribute('transform', `translate(${tx} ${ty}) scale(${scale})`);
}
const WORLD_W = 1580, WORLD_H = 1460;
function fit() {
  const r = canvas.getBoundingClientRect();
  scale = Math.min(r.width / WORLD_W, r.height / (WORLD_H + 60)) * 0.98;
  tx = (r.width - WORLD_W * scale) / 2;
  ty = (r.height - WORLD_H * scale) / 2 + 20;
  applyTransform();
}
function zoomAt(cx, cy, factor) {
  const ns = Math.min(3, Math.max(0.15, scale * factor));
  tx = cx - (cx - tx) * (ns / scale);
  ty = cy - (cy - ty) * (ns / scale);
  scale = ns;
  applyTransform();
}
canvas.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = canvas.getBoundingClientRect();
  zoomAt(ev.clientX - r.left, ev.clientY - r.top, ev.deltaY < 0 ? 1.12 : 1 / 1.12);
}, { passive: false });
let dragging = false, lx = 0, ly = 0, moved = 0;
canvas.addEventListener('mousedown', ev => { dragging = true; moved = 0; lx = ev.clientX; ly = ev.clientY; canvas.classList.add('dragging'); });
window.addEventListener('mousemove', ev => {
  if (!dragging) return;
  moved += Math.abs(ev.clientX - lx) + Math.abs(ev.clientY - ly);
  tx += ev.clientX - lx; ty += ev.clientY - ly;
  lx = ev.clientX; ly = ev.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => { dragging = false; canvas.classList.remove('dragging'); });
canvas.addEventListener('click', ev => {
  if (moved > 6) return;           // it was a drag, not a click
  lockedSel = false;
  select(null, false);
});
document.getElementById('btnFit').onclick = fit;
document.getElementById('btnPlus').onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1.25); };
document.getElementById('btnMinus').onclick = () => { const r = canvas.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, 1 / 1.25); };
window.addEventListener('resize', fit);

// touch pan (basic)
let tlx = 0, tly = 0;
canvas.addEventListener('touchstart', ev => { if (ev.touches.length === 1) { tlx = ev.touches[0].clientX; tly = ev.touches[0].clientY; } }, { passive: true });
canvas.addEventListener('touchmove', ev => {
  if (ev.touches.length === 1) {
    tx += ev.touches[0].clientX - tlx; ty += ev.touches[0].clientY - tly;
    tlx = ev.touches[0].clientX; tly = ev.touches[0].clientY;
    applyTransform();
  }
}, { passive: true });

renderDefaultSidebar();
applyDim();
fit();
</script>
</body>
</html>
