# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage public site (ONLY runtime assets — never the whole repo)
        run: |
          # Security: the previous deploy uploaded the entire repo (path: '.'),
          # which published backend source, tests, and secrets. We now copy only
          # the files the PWA actually serves. Keep this list in sync with the
          # SHELL_ASSETS precache list in sw.js.
          set -euo pipefail
          mkdir -p _site
          cp index.html sw.js app.js data.js demo-data.js pb-core.js pb-data.js pb-store.js pb-content.js pb-import.js pb-views.js pb-modals.js styles.css \
             manifest.json manifest-light.json _site/
          cp -r brand _site/
          cp -r logos _site/
          # Guard 1: fail the deploy if any expected runtime asset is missing.
          missing=0
          for f in index.html sw.js app.js data.js demo-data.js pb-core.js pb-data.js pb-store.js pb-content.js pb-import.js pb-views.js pb-modals.js styles.css \
                   manifest.json manifest-light.json \
                   brand/favicon.svg brand/apple-touch-icon.png brand/icon-192.png \
                   brand/splash/dark-393x852@3x.png brand/splash/light-393x852@3x.png \
                   logos/CRYPTO-AAVE.png; do
            if [ ! -e "_site/$f" ]; then echo "::error::missing runtime asset $f"; missing=1; fi
          done
          # Guard 2: fail the deploy if any known-sensitive file leaked into _site.
          for bad in stooq_cookies.txt settings.local.json; do
            if [ -e "_site/$bad" ]; then echo "::error::secret leaked into deploy: $bad"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Deploy staging failed — aborting."; exit 1; }
          # The logo pack is thousands of tiles; listing each one buries the
          # runtime files this log exists to let a human eyeball. Count them
          # instead, and still print every non-logo file.
          # NOTE: every line here must stay indented inside the `run: |` block —
          # a continuation starting at column 0 ends the YAML block scalar and
          # GitHub rejects the whole workflow (startup_failure, zero jobs, no
          # deploy at all). Use variables rather than a wrapped `echo`.
          staged_total=$(find _site -type f | wc -l)
          staged_tiles=$(find _site/logos -type f | wc -l)
          echo "Staged $staged_total files for deploy ($staged_tiles of them logo tiles):"
          (cd _site && find . -type f -not -path './logos/*' | sort)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
