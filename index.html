<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Playbook · Jan's 30% Target</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Investment playbook — live prices, P/L, price alerts">

<meta name="mobile-web-app-capable" content="yes">

<!-- Brand icons (see ./brand). The apple-touch-icon + manifest links carry ids so
     the home-screen icon can swap between the dark and light tile via applyIconTheme(). -->
<link id="manifestLink" rel="manifest" href="./manifest.json">
<link rel="icon" type="image/svg+xml" href="./brand/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="./brand/favicon-32.png">
<link id="appleTouchIcon" rel="apple-touch-icon" href="./brand/apple-touch-icon.png">
<script>
  // Home-screen / tab icon theme. Default dark; user can pick light in Settings.
  // Runs before the app so the apple-touch-icon (read by iOS at "Add to Home
  // Screen") and the manifest (read by Android at install) reflect the choice.
  (function () {
    function applyIconTheme(theme) {
      theme = theme === 'light' ? 'light' : 'dark';
      var suffix = theme === 'light' ? '-light' : '';
      var at = document.getElementById('appleTouchIcon');
      if (at) at.setAttribute('href', './brand/apple-touch-icon' + suffix + '.png');
      var ml = document.getElementById('manifestLink');
      if (ml) ml.setAttribute('href', theme === 'light' ? './manifest-light.json' : './manifest.json');
      try { localStorage.setItem('pb.iconTheme.v1', JSON.stringify(theme)); } catch (e) {}
      window.__pbIconTheme = theme;
    }
    window.applyIconTheme = applyIconTheme;
    var stored = 'dark';
    try { var raw = localStorage.getItem('pb.iconTheme.v1'); if (raw) stored = JSON.parse(raw); } catch (e) {}
    applyIconTheme(stored === 'light' ? 'light' : 'dark');
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- Pre-React splash. Reuses the same `.pb-loader` styles (styles.css) as the
     in-app React <LoadingScreen>, so the handoff is seamless: when React mounts
     this fades out via `.pb-hiding` while the React loader (z-index 9999) takes
     over until the dashboard's first quotes land. -->
<div id="pb-splash" class="pb-loader" role="status" aria-label="Loading Playbook">
  <div class="pb-tile">
    <span class="pb-bar"></span>
    <span class="pb-bar"></span>
    <span class="pb-bar"></span>
    <span class="pb-sheen"></span>
  </div>
  <div class="pb-word">Playbook</div>
</div>

<div id="root"></div>

<!-- React (production) -->
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

<!-- App -->
<!-- pb-core.js MUST load before app.js: app.js reads window.PBCore (shared
     market-hours + alert evaluation, also used by backend/worker.js). -->
<script src="./pb-core.js"></script>
<script src="./pb-data.js"></script>
<script src="./pb-store.js"></script>
<script src="./pb-content.js"></script>
<script src="./data.js"></script>
<script src="./demo-data.js"></script>
<script src="./app.js"></script>

<script>
  // Retire the pre-React splash once React mounts. The in-app <LoadingScreen>
  // (identical .pb-loader, z-index 9999) is already covering it, so we just fade
  // this one out (300ms, matching .pb-hiding) and remove it.
  function hidePbSplash() {
    const el = document.getElementById('pb-splash');
    if (!el) return;
    el.classList.add('pb-hiding');
    setTimeout(() => el.remove(), 350);
  }
  const obs = new MutationObserver(() => {
    const root = document.getElementById('root');
    if (root && root.children.length > 0) {
      hidePbSplash();
      obs.disconnect();
    }
  });
  obs.observe(document.getElementById('root'), { childList: true, subtree: true });
  // Fail-safe: hide after 8s regardless
  setTimeout(hidePbSplash, 8000);
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { scope: './' })
        .then(reg => {
          // Check for updates every 60 seconds
          setInterval(() => reg.update(), 60000);

          reg.addEventListener('updatefound', () => {
            const incoming = reg.installing;
            incoming.addEventListener('statechange', () => {
              if (incoming.state === 'installed' && navigator.serviceWorker.controller) {
                // New version ready — tell SW to activate, then reload
                incoming.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        })
        .catch(err => console.warn('[SW] Registration failed:', err));

      // When a new SW takes over, reload the page to get fresh assets
      let refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });
    });
  }
</script>

</body>
</html>
